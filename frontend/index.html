<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Notes Saver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Quick Notes Saver</h1>

        <p class="subtitle">
            Save your important notes quickly
        </p>


        <form id="noteForm">

            <div class="form-group">

                <label for="title">
                    Note Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter note title"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Note Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your note here..."
                    required
                ></textarea>

            </div>


            <button type="submit">
                Save Note
            </button>

        </form>


        <p id="responseMessage"></p>


        <a href="notes.html" class="view-notes">
            View Notes
        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
